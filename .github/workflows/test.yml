name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One version failing should still report the others, so a break can be
      # read as "only on the floor" rather than just "red".
      fail-fast: false
      matrix:
        # The floor the README promises, the newest 22.x, and the current LTS.
        # The floor is pinned exactly: Electron 44 needs require(esm), which
        # first shipped in 22.12.0, so that patch is the promise — not 22 as a
        # whole.
        node: ['22.12.0', '22', '24']

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Electron 42 moved the ~100MB binary download out of postinstall and
      # into first run, so --ignore-scripts no longer carries any weight here.
      # It stays because it is still the right default for CI, and nothing
      # under test launches Electron: everything is pure Node or jsdom.
      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
