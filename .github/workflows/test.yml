name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One version failing should still report the others, so a break can be
      # read as "only on the floor" rather than just "red".
      fail-fast: false
      matrix:
        # The floor the README promises, the newest 22.x, and the current LTS.
        # The floor is pinned exactly: Electron 44 needs require(esm), which
        # first shipped in 22.12.0, so that patch is the promise — not 22 as a
        # whole.
        node: ['22.12.0', '22', '24']

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Electron 42 moved the ~100MB binary download out of postinstall and
      # into first run, so --ignore-scripts no longer carries any weight here.
      # It stays because it is still the right default for CI, and nothing
      # under test launches Electron: everything is pure Node or jsdom.
      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Everything above is pure Node or jsdom, on purpose: it is what lets that
  # job run in a couple of seconds with no real browser. But jsdom cannot
  # fake Menu.setApplicationMenu, dialog.showMessageBox, real win.close()
  # semantics or a real filesystem write from a real main process — the last
  # four PRs on this repo only turned up real bugs in those by launching the
  # actual Electron binary under Xvfb by hand. This job is that check made
  # permanent, kept in its own job rather than folded into the matrix above
  # so a flake here can never make the fast, deterministic suite read red.
  electron-smoke:
    runs-on: ubuntu-latest

    # Xvfb plus a real downloaded Electron binary can be flaky in ways the
    # pure/jsdom job above structurally cannot be, and the only place this
    # job has actually been run end-to-end is a local container under Xvfb —
    # not a real GitHub Actions runner, whose exact Electron/Xvfb interaction
    # could not be verified before this landed. Non-blocking until it has
    # proven itself reliable here; flip this once it has a track record.
    continue-on-error: true

    strategy:
      matrix:
        # Electron's own window/menu/dialog/filesystem behaviour is not
        # Node-version sensitive the way the fast job's require(esm) floor
        # test is, so this runs on one version rather than that job's
        # three-way matrix — the floor from package.json's engines field,
        # since that is the one version everyone running this app is
        # promised to have.
        node: ['22.12.0']

    name: electron smoke (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The opposite of the fast job's Install step: this tier's whole point
      # is a real Electron binary, so the download is not skipped here.
      # Playwright's own bundled browsers are skipped regardless —
      # _electron.launch drives this project's own Electron directly and
      # never touches a Playwright-managed Chromium.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # `npm ci` alone does NOT fetch the ~100MB Electron binary: the
      # `electron` package ships no postinstall script, so nothing downloads
      # it until something actually requires the package (which is what
      # `npm start` does in normal use). test/electron/smoke.test.js
      # deliberately does not trigger that itself — it reads path.txt/dist/
      # directly rather than through require('electron'), specifically so a
      # local `npm run test:electron` with no binary present skips cleanly
      # instead of surprising a developer with a big download. Which means
      # CI has to be the one to trigger it, explicitly, or every test here
      # skips forever and this job passes green without ever running.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # ubuntu-latest has no display server by default. xvfb-run over a
      # maintained action: it is one apt package and one command this repo
      # can read and reason about directly, rather than another third-party
      # action in the trust chain, and every step here already does the same
      # kind of plain, inspectable thing.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Electron smoke tests
        run: xvfb-run -a npm run test:electron
